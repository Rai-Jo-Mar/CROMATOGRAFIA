    <script>

         * @date 2025
         * @brief Simulador didàctic de Cromatografia de Gasos (GC) amb programa de temperatura.
         */

        // --- INTERNACIONALITZACIÓ (i18n) ---
        const translations = {

            },
            en: {

                simulatorSubtitle: "Temperature Program, Flow, and Column Type.",
                statusLabel: "STATUS",
                statusReady: "READY",
                statusAnalyzing: "ANALYZING...",
                methodParameters: "Method Parameters (Carrier Gas & Oven)",
                carrierGas: "Carrier Gas",
                carrierGasFlow: "Carrier Gas Flow",

            },
            eu: {

                statusLabel: "EGOERA",
                statusReady: "PREST",
                methodParameters: "Metodoaren Parametroak (Gas Eramailea eta Labea)",
                carrierGas: "Gas Eramailea",
            },
            gl: {
                simulatorTitle: "Simulador de Cromatografía de Gases (GC)",
                statusLabel: "ESTADO",
                statusReady: "LISTO",
                methodParameters: "Parámetros do Método (Gas Portador e Forno)",
                carrierGas: "Gas Portador",
            }
        };

        const t = (key) => {
            const lang = appState.currentLanguage;
            // Intenta obtenir la traducció per a l'idioma actual.
            // Si no existeix, intenta amb 'es' (castellà) com a fallback principal.
            // Si tampoc existeix, utilitza 'ca' (català) com a últim recurs.
            // Si res funciona, mostra la clau.
            return translations[lang]?.[key] 
                || translations['es']?.[key] 
                || translations['ca']?.[key] 
                || `[${key}]`;
        };

        // --- MODELS DE DADES I ESTAT DE L'APLICACIÓ ---

        const CARRIER_GASES = [
            { id: 'He', name: 'Heli (He)', efficiencyFactor: 1.0, viscosityFactor: 1.0 }, // Estàndard
            { id: 'H2', name: 'Hidrogen (H₂)', efficiencyFactor: 1.2, viscosityFactor: 0.8 }, // Més eficient, menys viscós
            { id: 'N2', name: 'Nitrogen (N₂)', efficiencyFactor: 0.8, viscosityFactor: 1.1 }, // Menys eficient, més viscós
        ];

        const COLUMN_TYPES = [
            { id: 'DB5', name: 'DB-5 (No polar)', baseEfficiency: 8000, polarityFactor: 1.0 },
            { id: 'DB1701', name: 'DB-1701 (Polaritat intermèdia)', baseEfficiency: 7000, polarityFactor: 1.1 },
            { id: 'WAX', name: 'WAX (Polar)', baseEfficiency: 6000, polarityFactor: 1.2 },
        ];

        const SAMPLE_MIXTURES = [
            {
                id: 'alkanes',
                name: 'Barreja d\'Alcans (C8-C12)',
                description: 'Una sèrie homòloga d\'hidrocarburs.',
                compounds: [
                    { name: 'Octà (C8)', bp: 126, color: '#3b82f6', concentration: 1.0 },
                    { name: 'Nonà (C9)', bp: 151, color: '#10b981', concentration: 1.0 },
                    { name: 'Decà (C10)', bp: 174, color: '#f59e0b', concentration: 1.0 },
                    { name: 'Undecà (C11)', bp: 196, color: '#ef4444', concentration: 1.0 },
                    { name: 'Dodecà (C12)', bp: 216, color: '#8b5cf6', concentration: 1.0 },
                ]
            },
            {
                id: 'aromas',
                name: 'Aromes i Fragàncies',
                description: 'Compostos volàtils comuns en aliments i perfums.',
                compounds: [
                    { name: 'Limonè', bp: 176, color: '#14b8a6', concentration: 1.0 },
                    { name: 'Linalool', bp: 198, color: '#f97316', concentration: 1.0 },
                    { name: 'Mentol', bp: 212, color: '#3b82f6', concentration: 1.0 },
                    { name: 'Vanil·lina', bp: 285, color: '#d946ef', concentration: 1.0 },
                ]
            },
        ];

        const defaultState = {
            // Paràmetres del Mètode GC
            carrierGasId: 'He',
            carrierGasFlow: 1.5, // mL/min
            useTempProgram: true,
            initialTemp: 50, // °C
            finalTemp: 250, // °C
            rampRate: 10, // °C/min
            isothermalTemp: 150, // °C
            columnLength: 30, // m
            selectedColumnId: 'DB5',
            selectedSampleId: 'alkanes',
        };

        const appState = {
            ...defaultState,
            currentLanguage: localStorage.getItem('chromaSimLang') || 'ca',
            theme: localStorage.getItem('chromaSimTheme') || 'light',
            // Estat de la Simulació
            isRunning: false,
            progress: 0, 
            systemError: null,
            animationInterval: null,
            pressure: 0, // Pressió en psi
            
            // Resultats del Càlcul
            chromatogramData: { peaks: [], criticalRs: { Rs: Infinity, comp1: '', comp2: '' } },
        };

        // --- MOTOR DEL SIMULADOR (GC) ---

        /**
         * Calcula les dades completes d'un cromatograma de gasos.
         * La retenció es modela principalment en funció del punt d'ebullició del compost i la temperatura del forn.
         * @param {object} params - Paràmetres del mètode.
         * @param {Array<object>} currentCompounds - Array de compostos a analitzar.
         * @param {object} selectedColumn - La columna seleccionada.
         */
        function calculateChromatogram(params, currentCompounds, selectedColumn) {
            const { carrierGasFlow, columnLength, useTempProgram, initialTemp, finalTemp, rampRate, isothermalTemp, carrierGasId } = params;

            if (!currentCompounds || currentCompounds.length === 0 || !selectedColumn) {
                return { peaks: [], criticalRs: { Rs: Infinity, comp1: '', comp2: '' } };
            }

            const selectedGas = CARRIER_GASES.find(g => g.id === carrierGasId);

            const deadTime = (columnLength / carrierGasFlow) * 0.1; // Model molt simplificat
            const N_base = selectedColumn.baseEfficiency;

            const calculatedPeaks = currentCompounds.map(comp => {
                let tr;
                const N = N_base * (columnLength / 30) * selectedGas.efficiencyFactor; // L'eficiència depèn del gas i la longitud

                // Model de retenció basat en el punt d'ebullició i la temperatura
                // L'elució es produeix quan la temperatura del forn s'acosta al punt d'ebullició efectiu
                const effectiveBoilingPoint = comp.bp * selectedColumn.polarityFactor;

                if (useTempProgram) {
                    if (effectiveBoilingPoint < initialTemp) {
                        // Elueix gairebé amb el temps mort si és molt volàtil
                        tr = deadTime * 1.2;
                    } else if (effectiveBoilingPoint > finalTemp) {
                        // No elueix si el seu punt d'ebullició és superior a la T final
                        tr = (finalTemp - initialTemp) / rampRate + 5; // Temps màxim simulat
                    } else {
                        // Temps per assolir la temperatura d'elució
                        const timeToElutionTemp = (effectiveBoilingPoint - initialTemp) / rampRate;
                        tr = deadTime + timeToElutionTemp;
                    }
                } else { // Mode Isotèrmic
                    // Model de factor de retenció (k) simplificat per a GC
                    const T_ratio = effectiveBoilingPoint / isothermalTemp;
                    const k = Math.exp(T_ratio - 1) * 0.5; // Relació exponencial
                    tr = deadTime * (1 + k);
                }

                // L'amplada del pic en GC és molt petita
                const sigma = (tr / Math.sqrt(N)) * 0.2; // Factor de reducció per a pics estrets
                const width = 4 * sigma; 
                const height = (1 / (sigma * Math.sqrt(2 * Math.PI))) * comp.concentration;

                return { ...comp, tr, width, height, sigma };
            }).sort((a, b) => a.tr - b.tr); // Ordenar pics per temps de retenció

            // Càlcul de la Resolució Crítica (Rs)
            let criticalRs = { Rs: Infinity, comp1: '', comp2: '' };
            for (let i = 1; i < calculatedPeaks.length; i++) {
                const peak1 = calculatedPeaks[i - 1];
                const peak2 = calculatedPeaks[i];
                
                const Rs = (2 * (peak2.tr - peak1.tr)) / (peak2.width + peak1.width);
                
                if (Rs > 0 && Rs < criticalRs.Rs) {
                    criticalRs = { Rs, comp1: peak1.name, comp2: peak2.name };
                }
            }

            return { peaks: calculatedPeaks, criticalRs };
        }

        /**
         * Calcula la pressió necessària a l'inici de la columna (en psi).
         * Model simplificat on la pressió és proporcional al flux, la longitud i la viscositat del gas.
         * @returns {number} La pressió calculada.
         */
        function calculatePressureGC(flow, length, gas) {
            if (!gas) return 0;
            // Model simplificat: P ∝ (flux * longitud * viscositat)
            const basePressure = flow * length * gas.viscosityFactor * 0.3; // Factor d'escala
            return Math.round(basePressure);
        }

        // --- CONTROLADORS DE L'APLICACIÓ ---

        /**
         * Funció principal que recalcula totes les dades del simulador (cromatograma i pressió) i ordena renderitzar la UI.
         */
        function updateChromatogramData() {
            const params = { ...appState };
            const selectedSample = SAMPLE_MIXTURES.find(s => s.id === params.selectedSampleId);
            const selectedColumn = COLUMN_TYPES.find(c => c.id === params.selectedColumnId);
            
            const currentCompounds = selectedSample ? JSON.parse(JSON.stringify(selectedSample.compounds)) : [];

            appState.chromatogramData = calculateChromatogram(params, currentCompounds, selectedColumn);
            
            const selectedGas = CARRIER_GASES.find(g => g.id === params.carrierGasId);
            appState.pressure = calculatePressureGC(params.carrierGasFlow, params.columnLength, selectedGas);
            
            renderUI();
        }

        /**
         * Inicia l'animació de l'anàlisi, actualitzant el progrés visualment.
         */
        function startAnalysis() {
            if (appState.isRunning) return;

            if (appState.animationInterval) clearInterval(appState.animationInterval);

            appState.progress = 0;
            appState.isRunning = true;
            renderUI();

            const maxTr = appState.chromatogramData.peaks.reduce((max, p) => Math.max(max, p.tr), 0);
            const maxTime = Math.max(maxTr * 1.2, 5);
            const animationDurationMs = 10000; // 10 segons
            const updateRate = 50; // ms

            appState.animationInterval = setInterval(() => {
                const currentTime = appState.progress + (updateRate / animationDurationMs) * maxTime;

                if (currentTime >= maxTime) {
                    stopAnalysis();
                    return;
                }
                appState.progress = currentTime;
                updateChromatogramAnimation(); 
            }, updateRate);
        }

        /**
         * Actualitza només els elements visuals que canvien durant l'animació per millorar el rendiment.
         */
        function updateChromatogramAnimation() {
            const statusSpan = document.querySelector('#status-display');
            if (statusSpan) {
                statusSpan.innerHTML = `${t('statusLabel')}: ${t('statusAnalyzing')}`;
            }
            renderChromatogramSVG();
        }

        /**
         * Atura l'anàlisi en curs i neteja l'interval de l'animació.
         */
        function stopAnalysis() {
            if (appState.animationInterval) {
                clearInterval(appState.animationInterval);
                appState.animationInterval = null;
            }
            appState.isRunning = false;
            appState.progress = 0;
            updateChromatogramData();
        }

        /**
         * Restaura tots els paràmetres del simulador als seus valors per defecte.
         */
        function resetSimulator() {
            if (appState.animationInterval) {
                clearInterval(appState.animationInterval);
                appState.animationInterval = null;
            }
            // Restaura l'estat als valors per defecte, mantenint les preferències d'idioma i tema
            const lang = appState.currentLanguage;
            const theme = appState.theme;
            Object.assign(appState, defaultState, { currentLanguage: lang, theme: theme, isRunning: false, progress: 0, systemError: null });
            updateChromatogramData();
        }


        // --- RENDERITZAT DEL DOM ---

        /**
         * Dibuixa el cromatograma en format SVG, incloent el traçat, eixos i marcadors.
         */
        function renderChromatogramSVG() {
            const svgRef = document.getElementById('chromatogram-svg');
            if (!svgRef) return;
            
            const { peaks } = appState.chromatogramData;
            const { isRunning, progress } = appState;

            const maxTr = peaks.reduce((max, p) => Math.max(max, p.tr), 0);
            const maxTime = Math.max(maxTr * 1.2, 5); 
            
            const width = 600;
            const height = 250;
            const padding = 40;

            let pathD = `M ${padding} ${height - padding}`;
            
            let maxYValue = 0;
            const dt_plot = 0.01; // Més resolució per a pics estrets
            
            for (let timeVal = 0; timeVal <= maxTime; timeVal += dt_plot) {
                let ySum = 0;
                peaks.forEach(peak => {
                    const xDiff = timeVal - peak.tr;
                    const yVal = peak.height * Math.exp(-(xDiff * xDiff) / (2 * peak.sigma * peak.sigma));
                    ySum += yVal;
                });
                if (ySum > maxYValue) maxYValue = ySum;
            }
            maxYValue = Math.max(maxYValue, 1); 
            const yScaleFactor = (height - 2 * padding) / (maxYValue * 1.2);
            const xScaleFactor = (width - 2 * padding) / maxTime;

            for (let timeVal = 0; timeVal <= maxTime; timeVal += dt_plot) {
                const x = timeVal * xScaleFactor;
                let ySum = 0;
                peaks.forEach(peak => {
                    const xDiff = timeVal - peak.tr;
                    const yVal = peak.height * Math.exp(-(xDiff * xDiff) / (2 * peak.sigma * peak.sigma));
                    ySum += yVal;
                });

                if (isRunning && timeVal > progress) {
                    const currentX = (progress / maxTime) * (width - 2 * padding) + padding;
                    pathD += ` L ${currentX} ${height - padding}`;
                    break;
                }

                const yPixel = (height - padding) - (ySum * yScaleFactor); 
                pathD += ` L ${x + padding} ${yPixel}`;
            }
            
            if (!isRunning || progress >= maxTime) {
                pathD += ` L ${width - padding} ${height - padding}`;
            }

            // Eixos i etiquetes (simplificat)
            let axisLabelsHTML = '';
            for (let i = 0; i <= 5; i++) {
                const timeValue = (maxTime / 5) * i;
                const xPos = timeValue * xScaleFactor + padding;
                axisLabelsHTML += `<text x="${xPos}" y="${height - padding + 15}" fill="#94a3b8" text-anchor="middle" font-size="10">${timeValue.toFixed(1)}</text>`;
            }

            svgRef.innerHTML = `
                <line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" stroke="#475569" stroke-width="2" />
                <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height-padding}" stroke="#475569" stroke-width="2" />
                <text x="${width/2}" y="${height-5}" fill="#94a3b8" text-anchor="middle" font-size="12">${t('timeUnit')}</text>
                <text x="15" y="${height/2}" fill="#94a3b8" transform="rotate(-90 15 ${height/2})" text-anchor="middle" font-size="12">${t('responseUnit')}</text>
                ${axisLabelsHTML}
                <path d="${pathD}" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
                ${isRunning ? `<line x1="${(progress / maxTime) * (width - 2 * padding) + padding}" y1="${padding}" x2="${(progress / maxTime) * (width - 2 * padding) + padding}" y2="${height - padding}" stroke="#f472b6" stroke-dasharray="4"/>` : ''}
            `;
        }

        /**
         * Funció principal que reconstrueix tota la interfície d'usuari basant-se en l'estat actual de `appState`.
         */
        function renderUI() {
            const root = document.getElementById('content-root');
            if (!root) return;

            else document.documentElement.classList.remove('dark');

            const selectedSample = SAMPLE_MIXTURES.find(s => s.id === appState.selectedSampleId);
            const { peaks, criticalRs } = appState.chromatogramData;

            root.innerHTML = `
                <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold text-indigo-700 dark:text-indigo-400 flex items-center gap-2">
                            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4 0-4-4-4-4v-3c0-4 4-4 4-4s4 0 4 4v3c0 0 0 4-4 4z"></path><path d="M12 2v2"></path><path d="M12 12v-2"></path><path d="M20 12h2"></path><path d="M2 12h2"></path><path d="m18.36 18.36.71.71"></path><path d="m4.93 4.93.71.71"></path><path d="m18.36 4.93-.71.71"></path><path d="m4.93 18.36-.71.71"></path></svg>
                            ${t('simulatorTitle')}
                        </h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">${t('simulatorSubtitle')}</p>
                    </div>
                    <div class="flex items-center justify-end flex-wrap gap-2">
                        <div id="status-display" class="text-sm font-mono bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-lg text-slate-700 dark:text-slate-200 flex items-center gap-4 w-full sm:w-auto">
                           <span class="${appState.systemError ? 'text-red-600' : 'text-emerald-600'}">
                                ${t('statusLabel')}: ${appState.systemError ? t('statusError') : appState.isRunning ? t('statusAnalyzing') : t('statusReady')}
                           </span>
                           <span class="border-l border-slate-300 dark:border-slate-500 pl-4 flex items-center gap-2">
                                P: ${appState.pressure} ${t('pressureUnit')}
                           </span>
                        </div>
                        <select id="language-selector" class="bg-white dark:bg-slate-700 dark:text-white border border-slate-300 dark:border-slate-600 rounded-md text-sm p-2 focus:ring-2 focus:ring-indigo-500">
                            <option value="ca">Català / Valencià</option>
                            <option value="es">Castellano (Español)</option>
                            <option value="en">English</option>
                            <option value="eu">Euskara</option>
                            <option value="gl">Galego</option>
                        </select>
                        <button id="theme-toggle-btn" class="p-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600">
                            <!-- Icona del tema s'injecta amb JS -->
                        </button>
                        <a href="index.html" title="Tornar a l'inici" class="p-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        </a>
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-4">${t('methodParameters')}</h2>
                            
                            <div class="mb-4">
                                <label class="text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">${t('carrierGas')}</label>
                                <select id="carrierGasId" ${appState.isRunning ? 'disabled' : ''} class="w-full p-2 bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500">
                                    ${CARRIER_GASES.map(gas => `<option value="${gas.id}" ${gas.id === appState.carrierGasId ? 'selected' : ''}>${gas.name}</option>`).join('')}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="flex justify-between text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
                                    <span>${t('carrierGasFlow')}</span>
                                    <span class="text-indigo-600 dark:text-indigo-400">${appState.carrierGasFlow.toFixed(1)} mL/min</span>
                                </label>
                                <input type="range" id="carrierGasFlow" min="0.5" max="5.0" step="0.1" value="${appState.carrierGasFlow}" ${appState.isRunning ? 'disabled' : ''} class="w-full accent-indigo-600"/>
                            </div>

                            <div class="mb-4 flex items-center justify-between p-2 bg-slate-100 dark:bg-slate-700/50 rounded-md">
                                <label class="flex items-center text-sm font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
                                    <input type="checkbox" id="useTempProgram" ${appState.useTempProgram ? 'checked' : ''} ${appState.isRunning ? 'disabled' : ''} class="form-checkbox h-4 w-4 text-indigo-600 rounded mr-2"/>
                                    ${t('useTempProgram')}
                                </label>
                                <span class="text-xs font-semibold ${appState.useTempProgram ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500 dark:text-slate-400'}">
                                    ${appState.useTempProgram ? t('program') : t('isothermal')}
                                </span>
                            </div>

                            ${appState.useTempProgram ? `
                                <div class="mb-4">
                                    <label class="text-sm font-medium text-slate-600 dark:text-slate-300">${t('initialTemp')}: <span class="text-indigo-600 dark:text-indigo-400">${appState.initialTemp}°C</span></label>
                                    <input type="range" id="initialTemp" min="30" max="150" step="5" value="${appState.initialTemp}" ${appState.isRunning ? 'disabled' : ''} class="w-full h-2 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-600"/>
                                </div>
                                <div class="mb-4">
                                    <label class="text-sm font-medium text-slate-600 dark:text-slate-300">${t('rampRate')}: <span class="text-indigo-600 dark:text-indigo-400">${appState.rampRate}°C/min</span></label>
                                    <input type="range" id="rampRate" min="2" max="40" step="1" value="${appState.rampRate}" ${appState.isRunning ? 'disabled' : ''} class="w-full h-2 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-600"/>
                                </div>
                                <div class="mb-4">
                                    <label class="text-sm font-medium text-slate-600 dark:text-slate-300">${t('finalTemp')}: <span class="text-indigo-600 dark:text-indigo-400">${appState.finalTemp}°C</span></label>
                                    <input type="range" id="finalTemp" min="150" max="300" step="10" value="${appState.finalTemp}" ${appState.isRunning ? 'disabled' : ''} class="w-full h-2 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-600"/>
                                </div>
                            ` : `
                                <div class="mb-4">
                                    <label class="text-sm font-medium text-slate-600 dark:text-slate-300">${t('ovenTemperature')}: <span class="text-indigo-600 dark:text-indigo-400">${appState.isothermalTemp}°C</span></label>
                                    <input type="range" id="isothermalTemp" min="50" max="280" step="5" value="${appState.isothermalTemp}" ${appState.isRunning ? 'disabled' : ''} class="w-full h-2 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-indigo-600"/>
                                </div>
                            `}
                        </div>

                        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-4">${t('sampleToAnalyze')}</h2>
                            <div class="mb-4">
                                <label class="text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">${t('selectSample')}</label>
                                <select id="selectedSampleId" ${appState.isRunning ? 'disabled' : ''} class="w-full p-2 bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500">
                                    ${SAMPLE_MIXTURES.map(s => `<option value="${s.id}" ${s.id === appState.selectedSampleId ? 'selected' : ''}>${s.name}</option>`).join('')}
                                </select>
                                <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">${t('sampleContains')} ${selectedSample?.description}</p>
                            </div>
                            <div class="flex gap-3">
                                <button id="inject-sample-btn" ${appState.isRunning ? 'disabled' : ''} class="flex-1 py-3 px-4 rounded-xl font-bold text-white shadow-md transition-all ${appState.isRunning ? 'bg-slate-400' : 'bg-indigo-600 hover:bg-indigo-700'}">
                                    ${t('injectSample')}
                                </button>
                                <button id="stop-btn" class="py-3 px-4 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-600">
                                    RESET
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md border border-slate-200 dark:border-slate-700">
                            <h3 class="font-bold text-slate-700 dark:text-slate-200 mb-2">${t('chromatogramTitle')}</h3>
                            <div class="h-64">
                                <svg id="chromatogram-svg" viewBox="0 0 600 250" class="w-full h-full bg-slate-900 rounded-lg shadow-inner border border-slate-700"></svg>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div class="bg-slate-100 dark:bg-slate-900/50 px-6 py-3 border-b border-slate-200 dark:border-slate-700">
                                <h3 class="font-bold text-slate-700 dark:text-slate-200">${t('integrationResults')}</h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                                    <thead class="text-xs text-slate-500 dark:text-slate-400 uppercase bg-slate-50 dark:bg-slate-700/50">
                                        <tr>
                                            <th class="px-6 py-3">${t('peak')} #</th>
                                            <th class="px-6 py-3">${t('compound')}</th>
                                            <th class="px-6 py-3 text-right">tR (min)</th>
                                            <th class="px-6 py-3 text-right">${t('boilingPoint')}</th>
                                            <th class="px-6 py-3 text-right">${t('resolution')}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${peaks.map((peak, idx) => {
                                            const Rs = (idx > 0) ? (2 * (peak.tr - peaks[idx-1].tr)) / (peak.width + peaks[idx-1].width) : 0;
                                            const isCritical = criticalRs.comp1 === peaks[idx-1]?.name && criticalRs.comp2 === peak.name;
                                            return `
                                                <tr class="border-b border-slate-100 dark:border-slate-700">
                                                    <td class="px-6 py-3 font-medium">${idx + 1}</td>
                                                    <td class="px-6 py-3 flex items-center gap-2">
                                                        <span class="w-3 h-3 rounded-full" style="background-color: ${peak.color};"></span>
                                                        ${peak.name}
                                                    </td>
                                                    <td class="px-6 py-3 text-right font-mono text-indigo-600 dark:text-indigo-400 font-bold">${peak.tr.toFixed(2)}</td>
                                                    <td class="px-6 py-3 text-right font-mono text-slate-500">${peak.bp}°C</td>
                                                    <td class="px-6 py-3 text-right font-mono">
                                                        ${idx > 0 ? `<span class="${isCritical ? 'font-bold text-red-600' : (Rs >= 1.5 ? 'text-emerald-600' : 'text-orange-500')}">${Rs.toFixed(2)}</span>` : '-'}
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            attachEventListeners();
            renderChromatogramSVG();

            // Demana a MathJax que torni a renderitzar les fórmules a la interfície
            if (window.MathJax) {
                MathJax.Hub.Queue(["Typeset", MathJax.Hub, root]);
            }

            // Actualitza la icona del tema
            updateThemeIcon(appState.theme);
        }

        /**
         * Adjunta tots els 'event listeners' als elements interactius de la interfície.
         */
        function attachEventListeners() {
            const handleInputChange = (id, type) => {
                const element = document.getElementById(id);
                if (!element) return;
                element.oninput = (e) => {
                    let value = e.target.value;
                    if (type === 'float') value = parseFloat(value);
                    if (type === 'int') value = parseInt(value);
                    if (type === 'bool') value = e.target.checked;
                    
                    appState[id] = value;
                    updateChromatogramData();
                };
            };

            document.getElementById('inject-sample-btn').onclick = startAnalysis;
            document.getElementById('stop-btn').onclick = resetSimulator;

            handleInputChange('carrierGasId', 'string');
            handleInputChange('carrierGasFlow', 'float');
            handleInputChange('useTempProgram', 'bool');
            handleInputChange('initialTemp', 'int');
            handleInputChange('finalTemp', 'int');
            handleInputChange('rampRate', 'int');
            handleInputChange('isothermalTemp', 'int');
            
            const langSelector = document.getElementById('language-selector');
            langSelector.value = appState.currentLanguage;
            langSelector.onchange = (e) => {
                appState.currentLanguage = e.target.value;
                localStorage.setItem('chromaSimLang', appState.currentLanguage);
                updateChromatogramData();
            };

            document.getElementById('theme-toggle-btn').onclick = () => {
                appState.theme = appState.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('chromaSimTheme', appState.theme);
                renderUI();
            };

            document.getElementById('selectedSampleId').onchange = (e) => {
                appState.selectedSampleId = e.target.value;
                updateChromatogramData();
            };
        }

        /**
         * Actualitza la icona del botó de canvi de tema (sol/lluna).
         * @param {string} theme - El tema actual ('light' o 'dark').
         */
        function updateThemeIcon(theme) {
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.innerHTML = theme === 'light' 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>' 
                    : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            }
        }

        /**
         * Punt d'entrada de l'aplicació. S'executa quan la pàgina ha carregat completament.
         */
        window.onload = function() {
            // No cal carregar des de localStorage aquí, ja que appState ja ho fa en la seva definició.
            updateChromatogramData(); 
            renderUI();
        };
    </script>
</body>
</html>
</body>
