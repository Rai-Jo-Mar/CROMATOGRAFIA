        // --- LÒGICA DE NEGOCI I CÀLCULS (MOTOR DEL SIMULADOR) ---

        /**
         * Calcula el factor de capacitat (k') per a un compost sota condicions específiques.
         * @param {object} comp - L'objecte del compost.
         * @param {number} phi - La fracció de dissolvent orgànic (0-1).
         * @param {number} tempEffect - El factor de correcció de la temperatura.
         * @param {number} pH - El pH de la fase mòbil.
         * @param {object} selectedColumn - L'objecte de la columna seleccionada.
         * @returns {number} El valor de k' calculat.
         */
        function calculateKPrime(comp, phi, tempEffect, pH, selectedColumn) {
            let k = comp.k_ref * Math.pow(10, -comp.S * phi);

            // Efecte del pH per a compostos ionitzables
            if (comp.pKa > 0) {
                const fractionNeutral = 1 / (1 + Math.pow(10, pH - comp.pKa));
                k = k * fractionNeutral; 
            }

            // Efecte de la selectivitat de la columna
            k = k * selectedColumn.selectivityFactor;
            return Math.max(0, k * tempEffect);
        }
        
        /**
         * Calcula les dades completes d'un cromatograma (pics, resolució) per a un conjunt de paràmetres.
         * @param {object} params - Objecte amb tots els paràmetres del mètode.
         * @param {Array<object>} currentCompounds - Array dels compostos a analitzar.
         * @param {object} selectedColumn - L'objecte de la columna seleccionada.
         * @returns {object} Un objecte amb `peaks`, `criticalRs` i `tR1`.
         */
        function calculateChromatogram(params, currentCompounds, selectedColumn) {
            const { flowRate, isocraticSolventB, columnLength, temperature, pH, useGradient, endSolventB, gradientTime } = params;

            if (!currentCompounds || currentCompounds.length === 0 || !selectedColumn) {
                return { peaks: [], criticalRs: { Rs: Infinity, comp1: '', comp2: '' }, tR1: 0 };
            }

            // Càlculs bàsics
            const deadVolumeFactor = 0.015; 
            const deadTime = (columnLength * deadVolumeFactor) / flowRate; 
            const maxTime = useGradient ? gradientTime * 2 : 30; 
            const tempEffect = 1 - (temperature - 25) * 0.015;
            const N_base = selectedColumn.baseEfficiency;

            // Càlcul de cada pic
            const calculatedPeaks = currentCompounds.map(comp => {
                let tr;
                const N = columnLength * N_base; 
                
                if (comp.k_ref === 0) {
                    // Temps mort
                    tr = deadTime;
                } else if (useGradient) {
                    // Càlcul de retenció en gradient (aproximació numèrica)
                    let sumKInverse = 0;
                    const dt = 0.05; 
                    const phiInitial = isocraticSolventB / 100;
                    const phiFinal = endSolventB / 100;
                    const phiSlope = (phiFinal - phiInitial) / gradientTime;

                    // Integració numèrica per trobar el temps de retenció
                    for (let t = deadTime; t < maxTime; t += dt) {
                        let currentPhi = phiInitial + phiSlope * (t - deadTime);
                        currentPhi = Math.min(Math.max(phiInitial, currentPhi), phiFinal); 

                        const kPrime_t = calculateKPrime(comp, currentPhi, tempEffect, pH, selectedColumn);
                        
                        sumKInverse += dt / kPrime_t;

                        if (sumKInverse >= 1) {
                            tr = t;
                            break;
                        }
                    }
                    tr = tr < maxTime ? tr : maxTime; 

                } else {
                    // Càlcul isocràtic
                    const phi = isocraticSolventB / 100;
                    const finalK = calculateKPrime(comp, phi, tempEffect, pH, selectedColumn);
                    tr = deadTime * (1 + finalK); 
                }
                
                // Càlcul de l'amplada i alçada del pic
                const sigma = tr / Math.sqrt(N);
                const width = 4 * sigma; 
                
                const height = (1 / (sigma * Math.sqrt(2 * Math.PI))) * 10 * comp.concentration; 

                return { ...comp, tr, width, height, sigma };
            });

            // Càlcul de la Resolució Crítica (Rs)
            const resolvablePeaks = calculatedPeaks.filter(p => p.tr > 0);
            let criticalRs = { Rs: Infinity, comp1: '', comp2: '' };
            
            for (let i = 1; i < resolvablePeaks.length; i++) {
                const peak1 = resolvablePeaks[i - 1];
                const peak2 = resolvablePeaks[i];

                if (peak1.name.includes('Temps Mort')) continue;
                
                // Fórmula de la resolució
                const Rs = (2 * (peak2.tr - peak1.tr)) / (peak2.width + peak1.width);
                
                if (Rs > 0 && Rs < criticalRs.Rs) {
                    criticalRs = {
                        Rs: Rs,
                        comp1: peak1.name,
                        comp2: peak2.name,
                    };
                }
            }
            
            // Temps de retenció del primer pic real (per a l'anàlisi de robustesa)
            const tR1 = calculatedPeaks.length > 1 ? calculatedPeaks[1].tr : 0;

            return { peaks: calculatedPeaks, criticalRs, tR1 };
        }

        // --- FUNCIONS D'UTILITAT ---

        /**
         * Calcula la contrapressió del sistema.
         * @param {number} flowRate - Flux (mL/min).
         * @param {number} columnLength - Longitud de la columna (mm).
         * @param {number} isocraticSolventB - Percentatge de solvent B.
         * @param {number} temperature - Temperatura (°C).
         * @returns {number} La pressió calculada en bar.
         */
        function calculatePressure(flowRate, columnLength, isocraticSolventB, temperature) {
            const viscosityFactor = 1 + 0.5 * Math.sin((isocraticSolventB / 100) * Math.PI); 
            const tempFactor = 1 - (temperature - 25) * 0.01; 
            let p = (flowRate * columnLength * viscosityFactor * tempFactor * 1.5); 
            return Math.max(0, Math.round(p));
        }

        /** @returns {object} Un objecte amb els paràmetres nominals actuals del mètode. */
        function getNominalParams() {
            return {
                flowRate: appState.flowRate,
                isocraticSolventB: appState.isocraticSolventB,
                columnLength: appState.columnLength,
                temperature: appState.temperature,
                pH: appState.pH,
                useGradient: appState.useGradient,
                endSolventB: appState.endSolventB,
                gradientTime: appState.gradientTime
            };
        }

        // --- CONTROLADORS DE L'APLICACIÓ ---

        /**
         * Actualitza totes les dades calculades (cromatograma, pressió) basant-se en l'estat actual.
         * Aquesta funció és el cor del simulador, recalculant resultats quan canvien els paràmetres.
         */
        function updateChromatogramData() {
            const nominalParams = getNominalParams();
            const selectedSample = getCurrentSample(appState.selectedSampleId);
            const selectedColumn = getCurrentColumn(appState.selectedColumnId);
            
            // Clona els compostos per a un càlcul net, assegurant concentració 1.0 per a Rs/tr.
            const currentCompounds = selectedSample ? JSON.parse(JSON.stringify(selectedSample.compounds)) : [];

            appState.chromatogramData = calculateChromatogram(nominalParams, currentCompounds, selectedColumn);
            
            appState.pressure = calculatePressure(appState.flowRate, appState.columnLength, appState.isocraticSolventB, appState.temperature);

            // Comprova si hi ha error de sobrepressió
            if (appState.pressure > MAX_PRESSURE) {
                appState.systemError = `SOBREPRESSIÓ! (${appState.pressure} bar). Redueixi el flux, la longitud o la temperatura.`;
                stopAnalysis();
            } else {
                appState.systemError = null;
            }

            renderUI();
        }
        /**
         * Inicia l'animació de l'anàlisi cromatogràfica.
         * @param {boolean} [isStandardInjection=false] - Indica si la injecció és d'un estàndard de calibració.
         */
        function startAnalysis(isStandardInjection = false) {
            if (appState.systemError || appState.isRunning || appState.isRobustnessTesting) return;

            // Neteja qualsevol interval anterior per evitar múltiples bucles
            if (appState.animationInterval) clearInterval(appState.animationInterval);

            // Si és una injecció estàndard, guarda la concentració per al càlcul posterior.
            if (isStandardInjection) {
                appState.calibConcentrationRef = appState.calibConcentration;
            } else {
                appState.calibConcentrationRef = 1.0; // Inyección de muestra normal
            }

            appState.progress = 0;
            appState.isRunning = true;
            renderUI();

            const maxTr = appState.chromatogramData.peaks.length > 0 
                ? appState.chromatogramData.peaks.reduce((max, p) => Math.max(max, p.tr), 0) 
                : 15;
            const maxTime = Math.max(maxTr * 1.2, 15);
            const animationDurationMs = 15000; // 15 segons d'animació total
            const updateRate = 50; // ms

            appState.animationInterval = setInterval(() => {
                const currentTime = appState.progress + (updateRate / animationDurationMs) * maxTime;

                if (currentTime >= maxTime) {
                    stopAnalysis(true);
                    return;
                }
                appState.progress = currentTime;
                updateChromatogramAnimation(); 
            }, updateRate);
        }

        /**
         * Actualitza només l'animació del cromatograma sense renderitzar tota la UI.
         * Això millora el rendiment i evita problemes en canviar altres estats (com el tema).
         */
        function updateChromatogramAnimation() {
            // Actualitza només el botó d'estat i el gràfic
            const statusSpan = document.querySelector('.flex.items-center.gap-4 .font-mono span');
            if (statusSpan) {
                statusSpan.innerHTML = `${t('statusLabel')}: ${t('statusAnalyzing')}`;
            }
            renderChromatogramSVG();
        }

        /**
         * Atura l'anàlisi en curs i reseteja l'estat de l'animació.
         * @param {boolean} [completed=false] - Indica si l'anàlisi ha finalitzat amb èxit.
         */
        function stopAnalysis(completed = false) {
            if (appState.animationInterval) {
                clearInterval(appState.animationInterval);
                appState.animationInterval = null;
            }
            appState.isRunning = false;
            appState.progress = 0; // Reseteja el progrés
            
            // Si l'anàlisi ha completat i era una injecció de calibració, afegeix el punt a la corba.
            if (completed && appState.calibConcentrationRef !== 1.0) {
                const nominalParams = getNominalParams();
                const selectedColumn = getCurrentColumn(appState.selectedColumnId);
                const selectedSample = getCurrentSample(appState.selectedSampleId);
                
                // Recalcula el cromatograma només amb el compost d'interès a la concentració injectada.
                const injectedCompounds = selectedSample.compounds.map((comp, idx) => ({ 
                    ...comp, 
                    // El segon compost (índex 1) és el que calibrem
                    concentration: (idx === 1) ? appState.calibConcentrationRef : 0.0 
                }));

                const injectedPeaks = calculateChromatogram(nominalParams, injectedCompounds, selectedColumn).peaks;
                const peakToCalibrate = injectedPeaks.find((p, idx) => idx === 1); 
                
                // Afegeix el nou punt de calibració si no existeix
                if(peakToCalibrate && peakToCalibrate.tr > 0) {
                    const newPoint = { 
                        concentration: appState.calibConcentrationRef, 
                        peakHeight: peakToCalibrate.height 
                    };
                    
                    // Evita duplicats
                    const exists = appState.calibrationData.some(p => p.concentration === newPoint.concentration);
                    if (!exists) {
                        appState.calibrationData.push(newPoint);
                        // Força el redibuix de la corba
                        drawCalibrationChart(appState.calibrationData, getCurrentSample(appState.selectedSampleId).compounds[1]?.name);
                    }
                }
                appState.calibConcentrationRef = 1.0; 
            }
            
            updateChromatogramData(); // Recalcula i actualitza la UI
        }

        /**
         * Executa el test de robustesa, simulant petites variacions en els paràmetres clau.
         */
        async function runRobustnessTest() {
            if (appState.isRunning || appState.systemError || appState.isRobustnessTesting) return;

            appState.isRobustnessTesting = true;
            appState.robustnessResults = null; 
            renderUI();

            const nominalParams = getNominalParams();
            const selectedSample = getCurrentSample(appState.selectedSampleId);
            const selectedColumn = getCurrentColumn(appState.selectedColumnId);
            const currentCompounds = selectedSample ? JSON.parse(JSON.stringify(selectedSample.compounds)) : [];

            // Defineix les variacions dels paràmetres a testejar
            const variations = [
                { param: 'flowRate', delta: 0.05, unit: 'mL/min', name: 'Flujo', nominal: nominalParams.flowRate }, 
                { param: 'pH', delta: 0.1, unit: 'pH', name: 'pH', nominal: nominalParams.pH }, 
                { param: 'isocraticSolventB', delta: 2, unit: '%', name: '% B Inicial', nominal: nominalParams.isocraticSolventB },
                { param: 'temperature', delta: 5, unit: '°C', name: 'Temperatura', nominal: nominalParams.temperature },
            ];

            const { tR1: nominal_tR1, criticalRs: nominal_Rs } = appState.chromatogramData;
            
            // Comprova que les condicions nominals són adequades per al test
            if(nominal_Rs.Rs === Infinity || nominal_tR1 === 0 || nominal_Rs.Rs < 1.5) {
                appState.systemError = 'Error de Robustesa: La separació nominal ha de ser adequada (Rs > 1.5).';
                appState.isRobustnessTesting = false;
                renderUI();
                return;
            }

            const robustnessAnalysis = variations.map(v => {
                // --- Nominal - Delta ---
                const lowParams = { ...nominalParams, [v.param]: nominalParams[v.param] - v.delta };
                const lowResults = calculateChromatogram(lowParams, currentCompounds, selectedColumn);
                
                // --- Nominal + Delta ---
                const highParams = { ...nominalParams, [v.param]: nominalParams[v.param] + v.delta };
                const highResults = calculateChromatogram(highParams, currentCompounds, selectedColumn);

                // Canvi percentual en tR1
                const tR_low_change = Math.abs((lowResults.tR1 - nominal_tR1) / nominal_tR1) * 100;
                const tR_high_change = Math.abs((highResults.tR1 - nominal_tR1) / nominal_tR1) * 100;
                const max_tR_change = Math.max(tR_low_change, tR_high_change);

                // Canvi percentual en Rs
                const Rs_nominal_safe = Math.max(0.01, nominal_Rs.Rs); 
                const Rs_low_change = Math.abs((lowResults.criticalRs.Rs - nominal_Rs.Rs) / Rs_nominal_safe) * 100;
                const Rs_high_change = Math.abs((highResults.criticalRs.Rs - nominal_Rs.Rs) / Rs_nominal_safe) * 100;
                const max_Rs_change = Math.max(Rs_low_change, Rs_high_change);

                return {
                    ...v,
                    variation: `${v.nominal.toFixed(2)} $\pm$ ${v.delta.toFixed(2)} ${v.unit}`,
                    max_tR_change: max_tR_change,
                    max_Rs_change: max_Rs_change,
                    isRobust: max_Rs_change < 5 && max_tR_change < 2 // Criteri d'exemple: <2% tR i <5% Rs
                };
            });
            
            // Simula un temps d'anàlisi per donar feedback a l'usuari
            await new Promise(resolve => setTimeout(resolve, 2000)); 

            appState.robustnessResults = robustnessAnalysis;
            appState.isRobustnessTesting = false;
            appState.isRobustnessModalOpen = true;
            renderUI();
        }

        // --- RENDERITZAT I MANIPULACIÓ DEL DOM ---

        /**
         * Dibuixa o actualitza el gràfic de la corba de calibració utilitzant Chart.js.
         * @param {Array<object>} data - Dades per a la corba [{concentration, peakHeight}].
         * @param {string} compoundName - Nom del compost que s'està calibrant.
         */
        function drawCalibrationChart(data, compoundName) {
            const chartCanvas = document.getElementById('calibration-chart');
            if (!chartCanvas) return;

            if (appState.calibrationChartInstance) {
                appState.calibrationChartInstance.destroy();
            }

            const sortedData = [...data].sort((a, b) => a.concentration - b.concentration);

            // Càlcul de la regressió lineal
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            const n = sortedData.length;

            sortedData.forEach(point => {
                sumX += point.concentration;
                sumY += point.peakHeight;
                sumXY += point.concentration * point.peakHeight;
                sumX2 += point.concentration * point.concentration;
            });

            const denominator = n * sumX2 - sumX * sumX;
            const m = denominator !== 0 ? (n * sumXY - sumX * sumY) / denominator : 0;
            const b = denominator !== 0 ? (sumY * sumX2 - sumX * sumXY) / denominator : 0;
            
            const minC = sortedData.length > 0 ? 0 : 0;
            const maxC = sortedData.length > 0 ? sortedData[n - 1].concentration * 1.2 : 5;
            const regressionData = [
                { x: minC, y: m * minC + b },
                { x: maxC, y: m * maxC + b }
            ];

            // Càlcul de R^2 (només per a visualització)
            let r2 = 0;
            if (n > 1) {
                const meanY = sumY / n;
                let sst = 0; 
                let sse = 0; 
                sortedData.forEach(point => {
                    const predictedY = m * point.concentration + b;
                    sst += Math.pow(point.peakHeight - meanY, 2);
                    sse += Math.pow(point.peakHeight - predictedY, 2);
                });
                r2 = sst !== 0 ? 1 - (sse / sst) : 0;
            }

            const ctx = chartCanvas.getContext('2d');
            appState.calibrationChartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Dades de Calibració',
                            data: sortedData.map(p => ({ x: p.concentration, y: p.peakHeight })),
                            backgroundColor: '#f59e0b',
                            borderColor: '#f59e0b',
                            pointRadius: 5,
                        },
                        {
                            label: 'Línia de Regressió',
                            data: regressionData,
                            type: 'line',
                            fill: false,
                            borderColor: '#3b82f6',
                            tension: 0.1,
                            pointRadius: 0,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: `Corba de Calibració: ${compoundName || 'Compost Desconegut'}`,
                            color: appState.theme === 'dark' ? '#cbd5e1' : '#334155'
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => `Conc: ${context.parsed.x.toFixed(2)}, Alçada: ${context.parsed.y.toFixed(2)}`,
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Concentració (unitats)', color: '#64748b' },
                            type: 'linear',
                            position: 'bottom',
                            min: 0,
                            ticks: { color: appState.theme === 'dark' ? '#94a3b8' : '#64748b' }
                        },
                        y: {
                            title: { display: true, text: 'Alçada del Pic (mAU)', color: '#64748b' },
                            min: 0,
                            ticks: { color: appState.theme === 'dark' ? '#94a3b8' : '#64748b' }
                        }
                    }
                }
            });

            // Actualizar la ecuación de la regresión
            const equationElement = document.getElementById('regression-equation');
            if (equationElement) {
                if (n > 1) {
                    equationElement.innerHTML = `Equació Aprox: $y = ${m.toFixed(2)}x ${b >= 0 ? '+' : ''} ${b.toFixed(2)}$ ($R^2 \\approx ${r2.toFixed(3)}$)`;
                    equationElement.classList.remove('text-slate-500', 'dark:text-slate-400');
                } else {
                    equationElement.textContent = 'Injecti almenys 2 estàndards per traçar la corba.';
                    equationElement.classList.add('text-slate-500', 'dark:text-slate-400');
                }
                // Demana a MathJax que torni a renderitzar les fórmules
                if (window.MathJax) {
                    MathJax.Hub.Queue(["Typeset", MathJax.Hub, equationElement]);
                }
            }
        }

        /** Dibuixa el cromatograma en format SVG. */
        function renderChromatogramSVG() {
            const svgRef = document.getElementById('chromatogram-svg');
            if (!svgRef) return;
            
            const { peaks } = appState.chromatogramData;
            const { isRunning, progress } = appState;

            const maxTr = peaks.length > 0 ? peaks.reduce((max, p) => Math.max(max, p.tr), 0) : 15;
            const maxTime = Math.max(maxTr * 1.2, 12); 
            
            const width = 600;
            const height = 250;
            const padding = 40;

            let pathD = `M ${padding} ${height - padding}`;
            
            let maxYValue = 0;
            const dt_plot = 0.05;
            
            // 1. Calcula el valor Y màxim per a l'escalat dinàmic
            for (let timeVal = 0; timeVal <= maxTime; timeVal += dt_plot) {
                let ySum = 0;
                peaks.forEach(peak => {
                    const xDiff = timeVal - peak.tr;
                    const yVal = peak.height * Math.exp(-(xDiff * xDiff) / (2 * peak.sigma * peak.sigma));
                    ySum += yVal;
                });
                if (ySum > maxYValue) {
                    maxYValue = ySum;
                }
            }
            maxYValue = Math.max(maxYValue, 0.1); 
            const yScaleFactor = (height - 2 * padding) / (maxYValue * 1.2);
            const xScaleFactor = (width - 2 * padding) / maxTime;

            // 2. Genera el camí del cromatograma
            let peakMarkersHTML = '';
            for (let timeVal = 0; timeVal <= maxTime; timeVal += dt_plot) {
                const x = timeVal * xScaleFactor;
                
                let ySum = 0;
                peaks.forEach(peak => {
                    const xDiff = timeVal - peak.tr;
                    const yVal = peak.height * Math.exp(-(xDiff * xDiff) / (2 * peak.sigma * peak.sigma));
                    ySum += yVal;
                });

                if (isRunning && timeVal > progress) {
                    const currentX = (progress / maxTime) * (width - 2 * padding) + padding;
                    pathD += ` L ${currentX} ${height - padding}`;
                    break;
                }

                const yPixel = (height - padding) - (ySum * yScaleFactor); 
                pathD += ` L ${x + padding} ${yPixel}`;
            }
            
            if (!isRunning || progress >= maxTime) {
                pathD += ` L ${width - padding} ${height - padding}`;
            }

            // 3. Genera els eixos i les etiquetes
            let yAxisLabels = '';
            const numYLabels = 4;
            const yMaxAbsorbance = (maxYValue * 1.2).toFixed(1); 
            for (let i = 0; i <= numYLabels; i++) {
                const labelValue = (yMaxAbsorbance / numYLabels) * i;
                const yPos = height - padding - (labelValue * (height - 2 * padding) / yMaxAbsorbance);
                yAxisLabels += `
                    <g>
                        <text x="${padding - 5}" y="${yPos + 4}" fill="#94a3b8" text-anchor="end" font-size="10">${labelValue.toFixed(1)}</text>
                        <line x1="${padding}" y1="${yPos}" x2="${padding + 5}" y2="${yPos}" stroke="#475569" stroke-width="1" />
                    </g>
                `;
            }
            
            let xAxisLabels = '';
            const numXLabels = 6;
            for (let i = 0; i <= numXLabels; i++) {
                const timeValue = (maxTime / numXLabels) * i;
                const xPos = timeValue * xScaleFactor + padding;
                xAxisLabels += `
                    <g>
                        <text x="${xPos}" y="${height - padding + 15}" fill="#94a3b8" text-anchor="middle" font-size="10">${timeValue.toFixed(1)}</text>
                        <line x1="${xPos}" y1="${height - padding}" x2="${xPos}" y2="${height - padding - 5}" stroke="#475569" stroke-width="1" />
                    </g>
                `;
            }
            
            // 4. Genera els marcadors dels pics (quan no s'està executant)
            if (!isRunning) {
                peaks.slice(1).forEach((peak, idx) => {
                    peakMarkersHTML += `
                        <g>
                            <text 
                                x="${(peak.tr / maxTime) * (width - 2 * padding) + padding}" 
                                y="${height - padding + 30}" 
                                fill="${peak.color}" 
                                text-anchor="middle" 
                                font-size="10"
                            >
                                ${idx + 2}
                            </text>
                            <line 
                                x1="${(peak.tr / maxTime) * (width - 2 * padding) + padding}" 
                                y1="${height - padding}" 
                                x2="${(peak.tr / maxTime) * (width - 2 * padding) + padding}" 
                                y2="${height - padding - 8}" 
                                stroke="${peak.color}" 
                                stroke-width="1" 
                                stroke-dasharray="2"
                            />
                        </g>
                    `;
                });
            }

            // 5. Indicador de progrés (quan s'està executant)
            let progressIndicatorHTML = '';
            if (isRunning) {
                progressIndicatorHTML = `
                    <line 
                        x1="${(progress / maxTime) * (width - 2 * padding) + padding}" 
                        y1="${padding}" 
                        x2="${(progress / maxTime) * (width - 2 * padding) + padding}" 
                        y2="${height - padding}" 
                        stroke="#f472b6" 
                        stroke-dasharray="4"
                    />
                `;
            }

            // 6. Munta el SVG final amb tots els seus components
            svgRef.innerHTML = `
                <!-- Grid lines -->
                <line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" stroke="#475569" stroke-width="2" />
                <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height-padding}" stroke="#475569" stroke-width="2" />
                
                <!-- Etiquetas Ejes -->
                <text x="${width/2}" y="${height-5}" fill="#94a3b8" text-anchor="middle" font-size="12">Temps (min)</text>
                <text x="15" y="${height/2}" fill="#94a3b8" transform="rotate(-90 15 ${height/2})" text-anchor="middle" font-size="12">Absorbancia (mAU)</text>
                ${yAxisLabels}
                ${xAxisLabels}

                <!-- El Cromatograma Principal -->
                <path d="${pathD}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
                
                ${progressIndicatorHTML}
                ${peakMarkersHTML}
            `;
        }

        /** Tanca el modal de robustesa. */
        function closeRobustnessModal() {
            appState.isRobustnessModalOpen = false;
            renderUI();
        }

        /** Funció principal de renderitzat que actualitza tota la interfície d'usuari. */
        function renderUI() {
            const root = document.getElementById('content-root');
            if (!root) return;
            
            // Aplica el tema fosc a l'element HTML
            if (appState.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {

                                        ${appState.isRobustnessTesting ? `
                                            <div class="text-center">
                                                <svg class="animate-spin h-6 w-6 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                                <p class="mt-2 text-sm text-blue-600">${t('calculating')}</p>
                                            </div>
                                        ` : appState.robustnessResults ? `
                                            <div class="text-center">
                                                <p class="text-4xl font-extrabold text-slate-700 mb-2">✅</p>
                                                <p class="text-sm text-slate-500 dark:text-slate-400">${t('resultsReady')}</p>
                                            </div>
                                        ` : `
                                            <div>
                                                <p class="text-slate-400 dark:text-slate-500">${t('pressStartTest')}</p>
                                                <p class="text-xs text-slate-400 dark:text-slate-500">${t('goodSeparationRequired')}</p>
                                            </div>
                                        `}
                                    </div>
                                    <button id="run-robustness-btn"
                                        ${appState.isRunning || appState.isRobustnessTesting || appState.systemError !== null || criticalRs.Rs < 1.5 ? 'disabled' : ''}
                                        class="w-full py-2 px-4 rounded-lg font-bold text-white transition-all text-sm
                                            ${appState.isRunning || appState.systemError || appState.isRobustnessTesting || criticalRs.Rs < 1.5 ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 active:scale-95'}
                                        "
                                        onclick="if(appState.robustnessResults) { appState.isRobustnessModalOpen = true; renderUI(); } else { runRobustnessTest(); }"
                                    >
                                        ${appState.robustnessResults ? t('viewResults') : t('startRobustnessTest')}
                                    </button>
                                    ${criticalRs.Rs < 1.5 ? `<p class="text-xs text-red-500 mt-2">${t('lowCriticalResolution')}</p>` : ''}
                                </div>
                            </div>

                        </div>
                        
                        <!-- Taula de Resultats (Integrador) -->
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div class="bg-slate-100 dark:bg-slate-900/50 px-6 py-3 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                <h3 class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2a2 2 0 0 0-2 2v7.5l-3 4.5h10l-3-4.5V4a2 2 0 0 0-2-2z"></path><path d="M10 2v2"></path><path d="M14 2v2"></path></svg>
                                    ${t('integrationResults')}
                                </h3>
                                <span class="text-sm font-semibold text-indigo-700 dark:text-indigo-400">${selectedSample?.name}</span>
                            </div>
                            
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                                    <thead class="text-xs text-slate-500 dark:text-slate-400 uppercase bg-slate-50 dark:bg-slate-700/50">
                                        <tr>
                                            <th class="px-6 py-3">${t('peak')} #</th>
                                            <th class="px-6 py-3">${t('compound')}</th>
                                            <th class="px-6 py-3 text-right">tR (min)</th>
                                            <th class="px-6 py-3 text-right">${t('width')} (min)</th>
                                            <th class="px-6 py-3 text-right">${t('kFactor')}</th>
                                            <th class="px-6 py-3 text-right">${t('resolution')}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${peaks.map((peak, idx) => {
                                            const Rs = (idx > 0 && peaks[idx-1].tr > 0 && peak.tr > 0) ? (2 * (peak.tr - peaks[idx-1].tr)) / (peak.width + peaks[idx-1].width) : 0;
                                            const isCritical = criticalRs.comp1 === peaks[idx-1]?.name && criticalRs.comp2 === peak.name;

                                            return `
                                                <tr class="border-b border-slate-100 dark:border-slate-700 transition-colors ${isCritical ? 'bg-red-100/50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50' : 'hover:bg-indigo-50 dark:hover:bg-slate-700/50'}">
                                                    <td class="px-6 py-3 font-medium">${idx + 1}</td>
                                                    <td class="px-6 py-3 flex items-center gap-2">
                                                        <span class="w-3 h-3 rounded-full" style="background-color: ${peak.color};"></span>
                                                        ${peak.name}
                                                    </td>
                                                    <td class="px-6 py-3 text-right font-mono text-indigo-600 dark:text-indigo-400 font-bold">
                                                        ${peak.tr.toFixed(2)}
                                                    </td>
                                                    <td class="px-6 py-3 text-right font-mono">
                                                        ${peak.width.toFixed(2)}
                                                    </td>
                                                    <td class="px-6 py-3 text-right font-mono text-slate-400 dark:text-slate-500">
                                                        ${idx === 0 ? '-' : ((peak.tr - peaks[0].tr)/peaks[0].tr).toFixed(2)}
                                                    </td>
                                                    <td class="px-6 py-3 text-right font-mono">
                                                        ${idx > 0 && peaks[idx-1].tr > 0 ? `
                                                            <span class="${isCritical ? 'font-bold text-red-600' : (Rs >= 1.5 ? 'text-emerald-600' : 'text-orange-500')}">
                                                                ${Rs.toFixed(2)}
                                                                ${isCritical ? ` ${t('critical')}` : ''}
                                                            </span>
                                                        ` : '-'}
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                                ${criticalRs.Rs !== Infinity && criticalRs.Rs > 0 ? `
                                    <div class="bg-slate-50 dark:bg-slate-700/50 p-3 text-center text-sm text-slate-600 dark:text-slate-300 border-t border-slate-200 dark:border-slate-700">
                                        ${t('minResolution')} <span class="font-bold ${criticalRs.Rs >= 1.5 ? 'text-emerald-600' : 'text-red-600'}">${criticalRs.Rs.toFixed(2)}</span> ${t('between')} <strong>${criticalRs.comp1}</strong> ${t('and')} <strong>${criticalRs.comp2}</strong>.
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="text-center text-xs text-slate-400 dark:text-slate-500 mt-8">
                    Simulador Educatiu v4.0 - Laboratori Virtual HPLC (Vanilla JS Refactoritzat)
                </footer>
            `;
            
            // Adjunta els 'event listeners' als elements del DOM
            attachEventListeners();
            
            // Renderitza els gràfics (SVG i Chart.js) després que el DOM estigui actualitzat
            renderChromatogramSVG();
            drawCalibrationChart(appState.calibrationData, selectedSample?.compounds[1]?.name);
            renderRobustnessModal();
        }

        /** Adjunta tots els 'event listeners' als controls de la interfície. */
        function attachEventListeners() {
            // Manejador genérico para inputs de tipo range y select
            const updateStateAndRender = (id, type) => {
                const element = document.getElementById(id);
                if (!element) return;
                element.oninput = (e) => {
                    let value = e.target.value;
                    if (type === 'float') value = parseFloat(value);
                    if (type === 'int') value = parseInt(value);
                    
                    appState[id] = value;
                    updateChromatogramData(); // Recalcula les dades, que crida a renderUI()
                };
            };
            
            // Botons d'acció principals
            document.getElementById('inject-sample-btn').onclick = () => startAnalysis(false);
            document.getElementById('stop-btn').onclick = stopAnalysis;
            
            const injectStandardBtn = document.getElementById('inject-standard-btn');
            if (injectStandardBtn) injectStandardBtn.onclick = () => startAnalysis(true);
            
            const clearCalibBtn = document.getElementById('clear-calib-btn');
            if (clearCalibBtn) clearCalibBtn.onclick = () => { appState.calibrationData = []; updateChromatogramData(); };

            const exportSvgBtn = document.getElementById('export-svg-btn');
            if (exportSvgBtn) exportSvgBtn.onclick = exportChromatogram;

            // Manejadores de Sliders y Selects
            updateStateAndRender('flowRate', 'float');
            updateStateAndRender('temperature', 'int');
            updateStateAndRender('isocraticSolventB', 'int');
            updateStateAndRender('endSolventB', 'int');
            updateStateAndRender('gradientTime', 'float');
            updateStateAndRender('pH', 'float');
            updateStateAndRender('columnLength', 'int');
            updateStateAndRender('selectedColumnId', 'string');
            
            // Slider de calibració
            const calibConcentrationInput = document.getElementById('calibConcentration');
            if (calibConcentrationInput) {
                calibConcentrationInput.oninput = (e) => {
                    appState.calibConcentration = parseFloat(e.target.value);
                    document.getElementById('calib-concentration-display').textContent = appState.calibConcentration.toFixed(1) + ' u.';
                };
            }
            
            // Selector de mostra (requereix netejar les dades de calibració)
            const selectedSampleIdInput = document.getElementById('selectedSampleId');
            if (selectedSampleIdInput) {
                selectedSampleIdInput.onchange = (e) => {
                    appState.selectedSampleId = e.target.value;
                    appState.calibrationData = []; // Reseteja la calibració
                    updateChromatogramData();
                };
            }

            // Selector d'idioma
            const langSelector = document.getElementById('language-selector');
            if (langSelector) {
                langSelector.value = appState.currentLanguage;
                langSelector.onchange = (e) => {
                    appState.currentLanguage = e.target.value;
                    updateChromatogramData();
                };
            }

            // Botó de canvi de tema
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.onclick = () => {
                    appState.theme = appState.theme === 'light' ? 'dark' : 'light';
                    renderUI();
                };
            }

            // Checkbox de Gradiente
            const useGradientInput = document.getElementById('useGradient');
            if (useGradientInput) {
                useGradientInput.onchange = (e) => {
                    appState.useGradient = e.target.checked;
                    updateChromatogramData();
                };
            }
        }
        
        /** Exporta el cromatograma actual com un fitxer SVG. */
        function exportChromatogram() {
            const svgRef = document.getElementById('chromatogram-svg');
            if (!svgRef) return;
            const svgData = new XMLSerializer().serializeToString(svgRef);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl = URL.createObjectURL(svgBlob);

            const downloadLink = document.createElement('a');
            downloadLink.href = svgUrl;
            downloadLink.download = `cromatograma_${appState.selectedSampleId}_${appState.flowRate}ml_B${appState.isocraticSolventB}%.svg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(svgUrl);
        }

        // --- INICIALITZACIÓ DE L'APLICACIÓ ---

        /** Punt d'entrada: s'executa quan la pàgina ha carregat completament. */
        window.onload = function() {
            // 1. Calcula l'estat inicial (omple appState.chromatogramData)
            updateChromatogramData(); 
            
            // 2. Renderitza la UI completa per primer cop
            renderUI();
            // Els 'event listeners' s'adjunten dins de renderUI() -> attachEventListeners()
        };
        
    </script>
</body>
</html>
